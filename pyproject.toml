[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recruitneo"
version = "0.1.0"
description = "AI-Powered Resume Relevance Engine - Score resumes against job descriptions with explainable feedback"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "RecruitNeo Contributors"}
]
keywords = [
    "resume",
    "ats",
    "hiring",
    "nlp",
    "machine-learning",
    "fastapi",
    "streamlit"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Human Resources",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Human Resources"
]
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "PyMuPDF==1.24.1",
    "python-docx==1.1.2",
    "spacy==3.8.7",
    "sentence-transformers==2.7.0",
    "scikit-learn==1.5.0",
    "rank-bm25==0.2.2",
    "rapidfuzz==3.9.0",
    "chromadb==0.5.0",
    "numpy==1.26.4",
    "google-genai",
    "streamlit==1.36.0",
    "plotly==5.22.0",
    "pandas==2.2.2",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "aiofiles==23.2.1",
    "Cython>=3.0.10",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
    "httpx",
    "ruff==0.5.0",
    "mypy==1.10.0",
    "pre-commit==3.7.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/recruitneo"
Repository = "https://github.com/yourusername/recruitneo"
Issues = "https://github.com/yourusername/recruitneo/issues"

[tool.setuptools.packages.find]
where = ["backend", "frontend", "tests"]
include = ["app*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "frontend", "tests"]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (sometimes needed)
]
fixable = ["I", "F", "UP", "SIM"]
unfixable = ["E", "W", "B", "C4"]
exclude = [".venv", "venv", "__pycache__", ".pytest_cache", "migrations", "alembic/versions"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
namespace_packages = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "spacy*",
    "chromadb*",
    "sentence_transformers*",
    "rank_bm25*",
    "rapidfuzz*",
    "streamlit*",
    "plotly*",
    "pydantic*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["backend", "frontend"]
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]